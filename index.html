<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUA 보내기</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d2430;--mute:#6b7380;--line:#e3dfd6;--ok:#1d7a46;--bad:#b42318;--acc:#6a3fd1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;gap:12px;align-items:center}.top img{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#ddd}
h1{font-size:22px;margin:0}.sub{color:var(--mute);font-size:13px;margin:2px 0 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;font-weight:700;margin:10px 0 4px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf7}
.row{display:flex;gap:8px;margin-top:8px}.row button{margin:0;padding:10px;font-size:15px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:17px;margin-top:12px}
button.sec{background:#ece6fb;color:var(--acc)}button:disabled{background:#c9c9cf;color:#fff}
.hint{color:var(--mute);font-size:13px;word-break:break-all}
.big{font-size:20px;font-weight:800;word-break:break-all}
.err{background:#fdecea;border:1px solid #f5c2bc;border-radius:10px;padding:10px;color:var(--bad);margin-top:10px;word-break:break-all}
.ok{background:#e6f4ea;border:1px solid #b7dfc3;border-radius:10px;padding:10px;color:var(--ok);margin-top:10px;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 2px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}td:first-child{color:var(--mute);width:30%}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<div class="top"><img src="https://raw.githubusercontent.com/ljy1217/pua-coin/main/pua.png" alt=""><div><h1>PUA 보내기</h1><p class="sub">큰 수량도 정확하게 · Phantom 승인 1번</p></div></div>
<div class="card" id="wal"><span class="hint">불러오는 중…</span></div>
<div class="card" id="form" hidden>
  <label for="to">받는 지갑 주소</label>
  <input id="to" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Solana 지갑 주소 붙여 넣기">
  <div class="hint" id="toHint"></div>
  <label for="amt">보낼 PUA 개수</label>
  <input id="amt" inputmode="decimal" autocomplete="off" placeholder="예: 50000000000">
  <div class="row"><button class="sec" data-p="25">25%</button><button class="sec" data-p="50">50%</button><button class="sec" data-p="100">전부</button></div>
  <div class="big" id="amtHint"></div>
  <button id="check">확인하기</button>
</div>
<div id="box"></div>
<p class="hint">이 페이지는 비밀번호·복구 문구를 절대 묻지 않습니다. 모든 거래는 Phantom에서 직접 승인합니다.<br>토큰: 7ZqsVXoVZe6WY1WTSmP566EhaLg3k39HNc4qHJEvJEQu</p>
</main>
<script type="module">
// PUA 보내기 — Phantom 보내기 화면이 큰 잔액(약 90억 개 이상)을 계산하지 못하는 문제를 피하려고 만든 페이지.
// 숫자는 전부 BigInt로 다룬다. 받는 곳은 사용자가 입력한 주소 하나뿐이다.
const MINT = '7ZqsVXoVZe6WY1WTSmP566EhaLg3k39HNc4qHJEvJEQu', DEC = 6, UNIT = 10n ** 6n;
const RPC = 'https://solana-rpc.publicnode.com', CU_PRICE = 100_000;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const comma = (s) => s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const fmt = (raw) => { const w = raw / UNIT, f = (raw % UNIT).toString().padStart(6, '0').replace(/0+$/, ''); return comma(w.toString()) + (f ? '.' + f : ''); };
const kor = (raw) => { let w = raw / UNIT; if (w === 0n) return ''; const jo = w / 1_000_000_000_000n, eok = (w / 100_000_000n) % 10_000n, man = (w / 10_000n) % 10_000n, one = w % 10_000n;
  return '= ' + [jo && jo + '조', eok && eok + '억', man && man + '만', one && one].filter(Boolean).join(' ') + ' 개'; };
const parse = (s) => { s = String(s).replace(/[,\s]/g, ''); if (!/^\d+(\.\d{0,6})?$/.test(s)) return null; const [w, f = ''] = s.split('.'); return BigInt(w) * UNIT + BigInt((f + '000000').slice(0, 6)); };
const fail = (m) => { $('box').innerHTML = `<div class="err">${esc(m)}</div>`; };

let W, Buffer;
try { ({ Buffer } = await import('https://esm.sh/buffer@6.0.3')); W = await import('https://esm.sh/@solana/web3.js@1.98.0'); }
catch { $('wal').innerHTML = '<div class="err">Solana 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 여세요.</div>'; throw 0; }
const P = (s) => new W.PublicKey(s);
const TOKEN = P('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'), ATA = P('ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL'), SYS = W.SystemProgram.programId, mint = P(MINT);
const u64 = (v) => { const b = new Uint8Array(8); let x = BigInt(v); for (let i = 0; i < 8; i++) { b[i] = Number(x & 0xffn); x >>= 8n; } return b; };
const k = (p, s, w) => ({ pubkey: p, isSigner: s, isWritable: w });
const ix = (p, keys, d) => new W.TransactionInstruction({ programId: p, keys, data: Buffer.from(d) });
const ataOf = (o) => W.PublicKey.findProgramAddressSync([o.toBuffer(), TOKEN.toBuffer(), mint.toBuffer()], ATA)[0];
const conn = new W.Connection(RPC, 'confirmed');
const bal = async (ata, c = 'confirmed') => { const r = await conn.getParsedAccountInfo(ata, c); return r.value ? BigInt(r.value.data.parsed.info.tokenAmount.amount) : 0n; };

// 지갑 연결
const provider = (window.phantom && window.phantom.solana) || window.solflare || window.solana || null;
if (!provider) {
  $('wal').innerHTML = '<div class="err">지갑 앱 안의 브라우저에서 열어 주세요.</div><button id="openPh">Phantom 앱에서 열기</button>';
  $('openPh').onclick = () => { location.href = 'https://phantom.app/ul/browse/' + encodeURIComponent(location.href) + '?ref=' + encodeURIComponent(location.origin); };
  throw 0;
}
let me, src, have = 0n;
async function refresh() {
  have = await bal(src);
  $('wal').innerHTML = `<div class="hint">내 지갑</div><div style="word-break:break-all">${me.toBase58()}</div><div class="hint" style="margin-top:8px">가진 PUA</div><div class="big">${fmt(have)}</div><div class="hint">${kor(have)}</div>`;
}
try { me = (await provider.connect()).publicKey; } catch { $('wal').innerHTML = '<div class="err">지갑 연결을 취소했습니다. 다시 열어 연결해 주세요.</div>'; throw 0; }
provider.on && provider.on('accountChanged', () => location.reload());
src = ataOf(me);
try { await refresh(); } catch (e) { $('wal').innerHTML = '<div class="err">잔액 조회 실패: ' + esc(e.message || e) + '</div>'; throw 0; }
$('form').hidden = false;

// 링크로 미리 채우기: ...#to=주소&amt=개수
try { const h = new URLSearchParams(location.hash.slice(1)); if (h.get('to')) $('to').value = h.get('to'); if (h.get('amt')) $('amt').value = h.get('amt'); } catch {}
// 같은 곳에 같은 개수를 다시 보내려 하면 한 번 더 묻는다(10분 안)
const lastKey = 'pua_last_send';
const lastSend = () => { try { return JSON.parse(localStorage.getItem(lastKey) || 'null'); } catch { return null; } };
$('amt').oninput = () => { const v = parse($('amt').value); $('amtHint').textContent = v == null ? ($('amt').value ? '숫자만 넣어 주세요 (소수점 6자리까지)' : '') : kor(v); };
document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { const v = have * BigInt(b.dataset.p) / 100n; $('amt').value = fmt(v).replace(/,/g, ''); $('amt').oninput(); });
$('to').oninput = () => { $('toHint').textContent = ''; };
$('amt').oninput();

let pending = false;
$('check').onclick = async () => {
  if (pending) return;
  $('box').innerHTML = '';
  let to; try { to = P($('to').value.trim()); } catch { return fail('받는 주소가 올바르지 않습니다.'); }
  if (to.equals(me)) return fail('내 지갑으로는 보낼 수 없습니다.');
  if (!W.PublicKey.isOnCurve(to.toBytes())) return fail('일반 지갑 주소가 아닙니다(프로그램 주소). 받는 지갑 주소를 다시 확인하세요.');
  const amt = parse($('amt').value);
  if (amt == null || amt <= 0n) return fail('보낼 개수를 넣어 주세요.');
  try { await refresh(); } catch (e) { return fail('잔액 조회 실패: ' + (e.message || e)); }
  if (amt > have) return fail('가진 PUA보다 많습니다. 가진 개수: ' + fmt(have));
  const info = await conn.getAccountInfo(to).catch(() => null);
  if (info && !info.owner.equals(SYS)) return fail('받는 주소가 일반 지갑이 아닙니다. 받는 지갑 주소를 다시 확인하세요.');
  const dst = ataOf(to);
  const prev = lastSend();
  const dup = prev && prev.from === me.toBase58() && prev.to === to.toBase58() && prev.amt === amt.toString() && Date.now() - prev.at < 600_000;
  const build = async () => {
    const bh = await conn.getLatestBlockhash('confirmed');
    const ixs = [W.ComputeBudgetProgram.setComputeUnitLimit({ units: 60_000 }), W.ComputeBudgetProgram.setComputeUnitPrice({ microLamports: CU_PRICE }),
      ix(ATA, [k(me, true, true), k(dst, false, true), k(to, false, false), k(mint, false, false), k(SYS, false, false), k(TOKEN, false, false)], Uint8Array.of(1)),
      ix(TOKEN, [k(src, false, true), k(mint, false, false), k(dst, false, true), k(me, true, false)], Uint8Array.from([12, ...u64(amt), DEC]))];
    return { bh, tx: new W.VersionedTransaction(new W.TransactionMessage({ payerKey: me, recentBlockhash: bh.blockhash, instructions: ixs }).compileToV0Message()) };
  };
  let cost;
  try {
    const { tx } = await build();
    const sol = await conn.getBalance(me);
    const v = (await conn.simulateTransaction(tx, { sigVerify: false, replaceRecentBlockhash: true, accounts: { encoding: 'base64', addresses: [me.toBase58()] } })).value;
    if (v.err) return fail('미리 돌려 보니 실패합니다: ' + JSON.stringify(v.err));
    const fee = (await conn.getFeeForMessage(tx.message)).value || 0;
    cost = sol - Number(v.accounts[0].lamports) + fee;
    if (sol < cost) return fail('SOL이 모자랍니다.');
  } catch (e) { return fail('검사 중 오류: ' + (e.message || e)); }
  const before = await bal(dst);
  $('box').innerHTML = (dup ? `<div class="err"><b>⚠️ ${Math.ceil((Date.now() - prev.at) / 60000)}분 전에 같은 주소로 같은 개수를 이미 보냈어요.</b><br>정말 한 번 더 보내려는 게 아니면 [취소]를 누르세요.</div>` : '') + `<div class="card"><b>이대로 보낼까요?</b><table>
    <tr><td>받는 지갑</td><td>${to.toBase58()}</td></tr>
    <tr><td>보낼 PUA</td><td><b>${fmt(amt)}</b><br><span class="hint">${kor(amt)}</span></td></tr>
    <tr><td>비용</td><td>약 ${(cost / 1e9).toFixed(6)} SOL</td></tr></table>
    <div class="hint">단추를 누른 뒤 1분 안에 Phantom에서 승인해 주세요.</div>
    <button id="go">보내기</button><button id="no" class="sec">취소</button></div>`;
  $('no').onclick = () => { $('box').innerHTML = ''; };
  $('go').onclick = async () => {
    if (pending) return; pending = true;
    $('go').disabled = true; $('no').disabled = true; $('check').disabled = true; $('go').textContent = '지갑에서 승인해 주세요…';
    let sig;
    try {
      const { tx, bh } = await build();
      try { sig = (await provider.signAndSendTransaction(tx)).signature; }
      catch (e) {
        if (e && (e.code === 4001 || /reject|cancel|declin/i.test(String(e.message)))) throw new Error('승인을 취소했습니다. 아무것도 보내지 않았습니다.');
        const m = Buffer.from(tx.message.serialize()).toString('hex'), signed = await provider.signTransaction(tx);
        if (Buffer.from(signed.message.serialize()).toString('hex') !== m) throw new Error('지갑이 거래 내용을 바꿔서 보내지 않았습니다.');
        sig = await conn.sendRawTransaction(signed.serialize(), { maxRetries: 5 });
      }
      $('go').textContent = '블록체인 확인 중…';
      for (;;) {
        const s = (await conn.getSignatureStatuses([sig], { searchTransactionHistory: true }).catch(() => ({ value: [null] }))).value[0];
        if (s && s.err) throw new Error('거래가 실패했습니다(아무것도 안 보내짐): ' + JSON.stringify(s.err));
        if (s && (s.confirmationStatus === 'confirmed' || s.confirmationStatus === 'finalized')) break;
        if (!s && (await conn.getBlockHeight().catch(() => 0)) > bh.lastValidBlockHeight) { await sleep(3000); if (!(await conn.getSignatureStatuses([sig], { searchTransactionHistory: true })).value[0]) throw new Error('승인이 늦어 거래가 버려졌습니다(아무것도 안 보내짐). 다시 해 주세요.'); }
        await sleep(2000);
      }
      try { localStorage.setItem(lastKey, JSON.stringify({ from: me.toBase58(), to: to.toBase58(), amt: amt.toString(), at: Date.now() })); } catch {}
      $('to').value = ''; $('amt').value = ''; $('amt').oninput(); history.replaceState(null, '', location.pathname);
      const after = await bal(dst);
      await refresh();
      const okAmt = after - before === amt;
      $('box').innerHTML = `<div class="${okAmt ? 'ok' : 'err'}"><b>${okAmt ? '보내기 완료!' : '보냈지만 받은 개수가 다릅니다. 확인이 필요합니다.'}</b><br>받은 PUA: ${fmt(after - before)}<br><a href="https://solscan.io/tx/${sig}" target="_blank">거래 기록 보기</a></div>`;
    } catch (e) {
      $('box').innerHTML = `<div class="err">${esc(e.message || e)}</div>` + (sig ? `<div class="hint">거래: ${sig} — 다시 보내기 전에 <a href="https://solscan.io/tx/${sig}" target="_blank">기록</a>부터 확인하세요.</div>` : '');
    } finally { pending = false; $('check').disabled = false; }
  };
};
</script>
</body>
</html>
