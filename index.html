<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUA 발행</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d2430;--mute:#6b7380;--line:#e3dfd6;--ok:#1d7a46;--bad:#b42318;--acc:#6a3fd1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;gap:12px;align-items:center}.top img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#ddd}
h1{font-size:22px;margin:0}.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
ol{margin:0;padding-left:0;list-style:none}li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}li:last-child{border:0}
.i{width:22px;flex:none;text-align:center}.d{color:var(--mute);font-size:13px;word-break:break-all}
button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:17px;margin-top:10px}
button.sec{background:#ece6fb;color:var(--acc)}button:disabled{background:#c9c9cf}
.err{background:#fdecea;border:1px solid #f5c2bc;border-radius:10px;padding:10px;color:var(--bad);margin-top:10px;word-break:break-all}
.ok{background:#e6f4ea;border:1px solid #b7dfc3;border-radius:10px;padding:10px;color:var(--ok);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 2px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}td:first-child{color:var(--mute);width:34%;word-break:keep-all}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#11151c;color:#cfe3ff;border-radius:10px;padding:10px;max-height:260px;overflow:auto}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<div class="top"><img id="logo" alt=""><div><h1>PUA 발행</h1><p class="sub">Solana 메인넷 · 1,000,000,000,000개 · 소수점 6</p></div></div>
<div class="card"><ol id="steps"></ol></div>
<div id="box"></div>
<div class="card"><b>기록</b><pre id="log"></pre></div>
</main>
<script type="module">
// PUA 메인넷 발행 페이지 — Phantom 앱 안 브라우저에서 연다. 모든 거래는 Phantom에서 사용자가 직접 승인한다.
// 복구 문구·개인키를 묻거나 저장하지 않는다. 외부로 자산을 보내는 명령은 없다(새 토큰·토큰 계정·메타데이터 계정 보증금과 네트워크 수수료만).
const CFG = {
  name: 'PUA', symbol: 'PUA', decimals: 6, supplyWhole: 1_000_000_000_000n,
  wallet: '77BKPhaQkqDfJ9JkxJKdiCAchsoGRpvkkyeXAovbMjQg',                      // 발행·수령 지갑(Phantom 15번)
  uri: 'https://raw.githubusercontent.com/ljy1217/pua-coin/main/pua.json',     // 메타데이터(로고·설명)
  image: 'https://raw.githubusercontent.com/ljy1217/pua-coin/main/pua.png',
  rpc: 'https://solana-rpc.publicnode.com', memo: 'PUA-MINT-v1', cuPrice: 100_000,
};
const RAW = CFG.supplyWhole * 10n ** BigInt(CFG.decimals);                     // 1,000,000,000,000,000,000 (u64 안)
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const log = (m) => { $('log').textContent += new Date().toLocaleTimeString() + '  ' + m + '\n'; $('log').scrollTop = 1e9; };
const STEPS = ['Phantom 15번 지갑 연결', '기존 발행·미확정 거래 확인', '발행 조건·수수료 검사', '로고·메타데이터 접근 확인', 'PUA 1조 개 발행 (Phantom 승인)',
  '15번 지갑으로 1조 개 수령', '블록체인에서 발행·수량 확인', '민팅·동결 권한 폐기 (Phantom 승인)', '권한 폐기 블록체인 확인', '결과 보고서 저장'];
const st = STEPS.map(() => ['·', '']);
function step(i, icon, detail) { st[i] = [icon, detail || '']; $('steps').innerHTML = STEPS.map((t, j) => `<li><span class="i">${st[j][0]}</span><span>${j + 1}. ${t}${st[j][1] ? '<br><span class="d">' + st[j][1] + '</span>' : ''}</span></li>`).join(''); }
step(0, '·');
$('logo').src = CFG.image;
function stop(i, why, retry) {
  step(i, '❌', esc(why)); log('멈춤: ' + why);
  $('box').innerHTML = `<div class="err"><b>${i + 1}단계에서 멈췄습니다.</b><br>${esc(why)}</div>` + (retry ? '<button id="retry" class="sec">처음부터 다시 확인</button>' : '');
  if (retry) $('retry').onclick = () => location.reload();
  throw new Error('STOP');
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ── 라이브러리(Solana 공식 web3.js, 버전 고정) ─────────────────────────────
let W, Buffer;
try { ({ Buffer } = await import('https://esm.sh/buffer@6.0.3')); W = await import('https://esm.sh/@solana/web3.js@1.98.0'); }
catch (e) { stop(0, 'Solana 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.', true); }
const P = (s) => new W.PublicKey(s);
const TOKEN = P('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'), ATA = P('ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL');
const META = P('metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s'), RENT = P('SysvarRent111111111111111111111111111111111'), MEMO = P('MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr');
const enc = new TextEncoder(), u8 = (n) => Uint8Array.of(n);
const u16 = (n) => Uint8Array.of(n & 255, (n >> 8) & 255), u32 = (n) => Uint8Array.of(n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255);
const u64 = (v) => { const b = new Uint8Array(8); let x = BigInt(v); if (x < 0n || x > 0xffffffffffffffffn) throw new Error('u64'); for (let i = 0; i < 8; i++) { b[i] = Number(x & 0xffn); x >>= 8n; } return b; };
const cat = (...p) => { const o = new Uint8Array(p.reduce((a, x) => a + x.length, 0)); let i = 0; for (const x of p) { o.set(x, i); i += x.length; } return o; };
const str = (s) => { const b = enc.encode(s); return cat(u32(b.length), b); };
const ix = (programId, keys, data) => new W.TransactionInstruction({ programId, keys, data: Buffer.from(data) });
const k = (pubkey, s, w) => ({ pubkey, isSigner: s, isWritable: w });
const ataOf = (o, m) => W.PublicKey.findProgramAddressSync([o.toBuffer(), TOKEN.toBuffer(), m.toBuffer()], ATA)[0];
const mdOf = (m) => W.PublicKey.findProgramAddressSync([enc.encode('metadata'), META.toBuffer(), m.toBuffer()], META)[0];
// SPL Token InitializeMint2(20): 소수점 6, 민팅·동결 권한 = 내 지갑(검증 뒤 폐기)
const ixInit = (m, a) => ix(TOKEN, [k(m, false, true)], cat(u8(20), u8(CFG.decimals), a.toBytes(), u8(1), a.toBytes()));
// 연관 토큰 계정 만들기(Idempotent, 1) — 주인 = 내 지갑
const ixAta = (p, ata, o, m) => ix(ATA, [k(p, true, true), k(ata, false, true), k(o, false, false), k(m, false, false), k(W.SystemProgram.programId, false, false), k(TOKEN, false, false)], u8(1));
// MintTo(7): 정확히 1조 × 10^6 원 단위를 내 토큰 계정으로
const ixMintTo = (m, d, a) => ix(TOKEN, [k(m, false, true), k(d, false, true), k(a, true, false)], cat(u8(7), u64(RAW)));
// SetAuthority(6) → 없음. 0 = 민팅, 1 = 동결
const ixRevoke = (m, a, t) => ix(TOKEN, [k(m, false, true), k(a, true, false)], cat(u8(6), u8(t), u8(0)));
// Metaplex CreateMetadataAccountV3(33): 이름·심볼·주소, 판매 수수료 0, is_mutable = true(수정 권한 유지, 수정 권한자 = 내 지갑)
const ixMeta = (md, m, a) => ix(META, [k(md, false, true), k(m, false, false), k(a, true, false), k(a, true, true), k(a, true, false), k(W.SystemProgram.programId, false, false), k(RENT, false, false)],
  cat(u8(33), str(CFG.name), str(CFG.symbol), str(CFG.uri), u16(0), u8(0), u8(0), u8(0), u8(1), u8(0)));
// 메모: 이 지갑의 거래 기록에서 "이미 발행했는지"를 찾는 표시
const ixMemo = (a) => ix(MEMO, [k(a, true, false)], enc.encode(CFG.memo));
const conn = new W.Connection(CFG.rpc, 'confirmed');
const wallet = P(CFG.wallet);
const recKey = 'pua_mainnet_' + CFG.wallet;
const loadRec = () => { try { return JSON.parse(localStorage.getItem(recKey) || 'null'); } catch { return null; } };
const saveRec = (r) => { try { localStorage.setItem(recKey, JSON.stringify(r)); } catch {} };
const fmtSol = (l) => (Number(l) / 1e9).toFixed(6) + ' SOL';
const fmtInt = (b) => BigInt(b).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const solscan = (t, id) => `https://solscan.io/${t}/${id}`;

// ── 1. Phantom 연결 ─────────────────────────────────────────────────────────
const provider = window.phantom && window.phantom.solana && window.phantom.solana.isPhantom ? window.phantom.solana : null;
if (!provider) {
  const link = 'https://phantom.app/ul/browse/' + encodeURIComponent(location.href) + '?ref=' + encodeURIComponent(location.origin);
  $('box').innerHTML = `<div class="err">이 페이지는 <b>Phantom 앱 안의 브라우저</b>에서 열어야 합니다.</div><button id="openPh">Phantom 앱에서 열기</button>`;
  $('openPh').onclick = () => { location.href = link; };
  stop(0, 'Phantom 지갑을 찾지 못했습니다. 아래 단추로 Phantom 앱에서 여세요.', false);
}
step(0, '⏳', 'Phantom 연결 창에서 [연결]을 눌러 주세요');
let me;
try { me = (await provider.connect()).publicKey.toString(); } catch (e) { stop(0, 'Phantom 연결을 취소했습니다. 다시 열어 연결해 주세요.', true); }
if (me !== CFG.wallet) stop(0, '지금 고른 지갑은 ' + me + ' 입니다. Phantom에서 15번 지갑(' + CFG.wallet + ')으로 바꾼 뒤 다시 여세요.', true);
provider.on && provider.on('accountChanged', () => location.reload());
step(0, '✅', CFG.wallet);

// ── 2. 기존 발행·미확정 거래 확인 (조회가 안 되면 멈춘다 — 중복 발행 막기) ──
step(1, '⏳');
let existingMint = null;
try {
  const rec = loadRec();
  let before, found = [];
  for (let page = 0; page < 10; page++) {
    const sigs = await conn.getSignaturesForAddress(wallet, { limit: 1000, before });
    found = found.concat(sigs.filter((s) => (s.memo || '').includes(CFG.memo)));
    if (sigs.length < 1000) break; before = sigs[sigs.length - 1].signature;
    if (page === 9) throw new Error('거래 기록이 너무 많아 끝까지 확인하지 못했습니다');
  }
  const okOnes = found.filter((s) => !s.err);
  if (okOnes.some((s) => s.confirmationStatus === 'processed')) stop(1, '아직 확정되지 않은 PUA 발행 거래가 있습니다. 1분 뒤 다시 열어 주세요(중복 발행 방지).', true);
  if (okOnes.length > 1) stop(1, '이 지갑에 PUA 발행 거래가 ' + okOnes.length + '번 있습니다. 더 발행하지 않습니다. 기록: ' + okOnes.map((s) => s.signature).join(', '), false);
  if (okOnes.length === 1) {
    const tx = await conn.getParsedTransaction(okOnes[0].signature, { maxSupportedTransactionVersion: 0, commitment: 'confirmed' });
    const init = tx && tx.transaction.message.instructions.find((x) => x.program === 'spl-token' && x.parsed && /initializeMint/.test(x.parsed.type));
    if (!init) stop(1, '이전 PUA 발행 거래에서 토큰 주소를 읽지 못했습니다: ' + okOnes[0].signature, true);
    existingMint = init.parsed.info.mint;
    saveRec({ ...(rec || {}), mint: existingMint, sig: okOnes[0].signature, status: 'done' });
    log('이미 발행된 PUA를 찾았습니다: ' + existingMint);
  } else if (rec && rec.sig && rec.status !== 'failed') {
    const s = (await conn.getSignatureStatuses([rec.sig], { searchTransactionHistory: true })).value[0];
    if (s && !s.err) { existingMint = rec.mint; }
    else if (s && s.err) { saveRec({ ...rec, status: 'failed' }); }
    else if ((await conn.getBlockHeight('confirmed')) <= rec.lastValidBlockHeight) stop(1, '방금 보낸 발행 거래의 결과를 아직 모릅니다. 1~2분 뒤 다시 열어 주세요(같은 거래를 또 보내지 않습니다).', true);
    else saveRec({ ...rec, status: 'failed' });
  }
} catch (e) { if (e.message === 'STOP') throw e; stop(1, '블록체인 조회에 실패해 중복 여부를 확인할 수 없습니다. 발행하지 않습니다. (' + (e.message || e) + ')', true); }
step(1, '✅', existingMint ? '이미 발행됨 → 확인 단계로 이어갑니다' : '이전 발행 없음');

// ── 3·4. 조건·수수료·메타데이터 검사, 5·6. 발행 ────────────────────────────
async function checkMetadata() {
  step(3, '⏳');
  let j;
  try { const r = await fetch(CFG.uri, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); j = await r.json(); }
  catch (e) { stop(3, '메타데이터 주소에 접근할 수 없습니다: ' + CFG.uri + ' (' + (e.message || e) + ')', true); }
  if (j.name !== CFG.name || j.symbol !== CFG.symbol || !j.image) stop(3, '메타데이터 내용이 다릅니다(이름·심볼·로고 주소)', true);
  try { const r = await fetch(j.image, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); const b = new Uint8Array(await r.arrayBuffer());
    if (!(b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47)) throw new Error('PNG 그림이 아닙니다'); log('로고 ' + Math.round(b.length / 1024) + 'KB 확인'); }
  catch (e) { stop(3, '로고 주소에 접근할 수 없습니다: ' + j.image + ' (' + (e.message || e) + ')', true); }
  step(3, '✅', CFG.uri);
}
async function sim(tx) {
  const bal = await conn.getBalance(wallet, 'confirmed');
  const v = (await conn.simulateTransaction(tx, { sigVerify: false, replaceRecentBlockhash: true, commitment: 'confirmed', accounts: { encoding: 'base64', addresses: [CFG.wallet] } })).value;
  const fee = (await conn.getFeeForMessage(tx.message, 'confirmed')).value || 0;
  return { bal, err: v.err, logs: v.logs || [], spent: v.accounts && v.accounts[0] ? bal - Number(v.accounts[0].lamports) : 0, fee };
}
async function buildMint(mintKp) {
  const m = mintKp.publicKey, ata = ataOf(wallet, m), md = mdOf(m);
  const rent = await conn.getMinimumBalanceForRentExemption(82);
  const ixs = [W.ComputeBudgetProgram.setComputeUnitLimit({ units: 200_000 }), W.ComputeBudgetProgram.setComputeUnitPrice({ microLamports: CFG.cuPrice }),
    W.SystemProgram.createAccount({ fromPubkey: wallet, newAccountPubkey: m, lamports: rent, space: 82, programId: TOKEN }),
    ixInit(m, wallet), ixAta(wallet, ata, wallet, m), ixMintTo(m, ata, wallet), ixMeta(md, m, wallet), ixMemo(wallet)];
  const bh = await conn.getLatestBlockhash('confirmed');
  const tx = new W.VersionedTransaction(new W.TransactionMessage({ payerKey: wallet, recentBlockhash: bh.blockhash, instructions: ixs }).compileToV0Message());
  return { tx, bh, mint: m, ata };
}
async function waitConfirm(sig, lastValid, want = 'confirmed') {
  for (let i = 0; ; i++) {
    const s = (await conn.getSignatureStatuses([sig], { searchTransactionHistory: true }).catch(() => ({ value: [null] }))).value[0];
    if (s && s.err) return { err: s.err };
    if (s && (s.confirmationStatus === want || s.confirmationStatus === 'finalized')) return { ok: true };
    const h = await conn.getBlockHeight('confirmed').catch(() => 0);
    if (h > lastValid && !s) { const last = (await conn.getSignatureStatuses([sig], { searchTransactionHistory: true })).value[0]; if (!last) return { dropped: true }; }
    await sleep(2000);
  }
}
async function phantomSend(tx) { // Phantom이 서명하고 보낸다(사용자 승인). 앱이 일부 서명된 거래를 못 받으면 서명만 받고 직접 보낸다
  try { const r = await provider.signAndSendTransaction(tx); return r.signature; }
  catch (e) {
    if (e && (e.code === 4001 || /reject|cancel|declin/i.test(String(e.message)))) throw new Error('Phantom에서 승인을 취소했습니다. 아무것도 보내지 않았습니다.');
    log('Phantom 서명·전송 실패(' + (e.message || e) + ') → 서명만 받아 직접 보냅니다');
    const before = Buffer.from(tx.message.serialize()).toString('hex');
    const signed = await provider.signTransaction(tx);
    if (Buffer.from(signed.message.serialize()).toString('hex') !== before) throw new Error('Phantom이 거래 내용을 바꿔서 보내지 않았습니다.');
    return await conn.sendRawTransaction(signed.serialize(), { maxRetries: 5, preflightCommitment: 'confirmed' });
  }
}

if (!existingMint) {
  step(2, '⏳');
  let plan;
  try {
    plan = await buildMint(W.Keypair.generate());
    const s = await sim(plan.tx);
    if (s.err) { s.logs.slice(-8).forEach(log); stop(2, '미리 돌려 보니 실패합니다: ' + JSON.stringify(s.err), true); }
    const total = s.spent + s.fee;
    if (s.bal < total + 3_000_000) stop(2, 'SOL이 모자랍니다. 잔액 ' + fmtSol(s.bal) + ', 필요 약 ' + fmtSol(total + 3_000_000), true);
    step(2, '✅', `이름 PUA · 심볼 PUA · ${fmtInt(CFG.supplyWhole)}개 · 소수점 6 · 예상 비용 약 ${fmtSol(total)} (잔액 ${fmtSol(s.bal)})`);
    plan.cost = total;
  } catch (e) { if (e.message === 'STOP') throw e; stop(2, '검사 중 오류: ' + (e.message || e), true); }
  await checkMetadata();

  step(4, '👉', '아래 단추를 누르면 Phantom 승인 창이 뜹니다');
  $('box').innerHTML = `<div class="card"><table>
    <tr><td>새 토큰 주소</td><td>${plan.mint.toBase58()}</td></tr>
    <tr><td>받는 지갑</td><td>${CFG.wallet} (15번)</td></tr>
    <tr><td>발행량</td><td>${fmtInt(CFG.supplyWhole)} PUA</td></tr>
    <tr><td>예상 비용</td><td>약 ${fmtSol(plan.cost)}</td></tr></table>
    <button id="go">PUA 1조 개 발행하기</button></div>`;
  await new Promise((res) => { $('go').onclick = res; });
  $('go').disabled = true; $('go').textContent = 'Phantom에서 승인해 주세요…';
  try {
    const mintKp = W.Keypair.generate(); // 보내기 직전 새로 묶는다(최신 블록 번호)
    const p = await buildMint(mintKp);
    const s = await sim(p.tx); if (s.err) { s.logs.slice(-8).forEach(log); stop(4, '보내기 직전 미리 돌려 보니 실패합니다: ' + JSON.stringify(s.err), true); }
    p.tx.sign([mintKp]); // 새 토큰 주소 키(권한 없음) 서명 — 이 뒤 버린다
    saveRec({ mint: p.mint.toBase58(), status: 'sending', lastValidBlockHeight: p.bh.lastValidBlockHeight, at: Date.now() });
    const sig = await phantomSend(p.tx);
    saveRec({ ...loadRec(), sig, status: 'pending' }); log('발행 거래 보냄: ' + sig);
    step(4, '⏳', '블록체인 확인 중… ' + sig.slice(0, 16) + '…');
    const r = await waitConfirm(sig, p.bh.lastValidBlockHeight);
    if (r.err) { saveRec({ ...loadRec(), status: 'failed' }); stop(4, '발행 거래가 실패했습니다: ' + JSON.stringify(r.err), true); }
    if (r.dropped) { saveRec({ ...loadRec(), status: 'failed' }); stop(4, '거래가 시간 안에 처리되지 않아 버려졌습니다(수수료도 안 나감). 다시 열어 처음부터 하세요.', true); }
    saveRec({ ...loadRec(), status: 'done' });
    existingMint = p.mint.toBase58();
    step(4, '✅', `<a href="${solscan('tx', sig)}" target="_blank">${sig.slice(0, 24)}…</a>`);
  } catch (e) {
    if (e.message === 'STOP') throw e;
    const rec = loadRec(); if (rec && rec.status === 'sending' && !rec.sig) saveRec({ ...rec, status: 'failed' });
    stop(4, (e.message || String(e)) + ' — 다시 열면 기존 거래 상태부터 확인합니다.', true);
  }
} else { step(2, '✅', '이미 발행됨 — 건너뜀'); step(3, '✅', '이미 발행됨 — 건너뜀'); step(4, '✅', '이미 발행됨: ' + existingMint); }

// ── 6·7. 블록체인에서 확인 ─────────────────────────────────────────────────
function readMeta(d) { let o = 1; const dv = new DataView(d.buffer, d.byteOffset, d.byteLength); const ua = new W.PublicKey(d.slice(o, o + 32)); o += 32; const mint = new W.PublicKey(d.slice(o, o + 32)); o += 32;
  const s = () => { const n = dv.getUint32(o, true); o += 4; const t = new TextDecoder().decode(d.slice(o, o + n)); o += n; return t.replace(/\0+$/, ''); };
  const name = s(), symbol = s(), uri = s(); o += 2; if (d[o++] === 1) { const n = dv.getUint32(o, true); o += 4 + n * 34; } o++; const isMutable = d[o++] === 1;
  return { updateAuthority: ua.toBase58(), mint: mint.toBase58(), name, symbol, uri, isMutable }; }
async function readChain(mintStr, commitment = 'confirmed') {
  const mint = P(mintStr), ata = ataOf(wallet, mint);
  const [mi, ai, mdi] = await Promise.all([conn.getParsedAccountInfo(mint, commitment), conn.getParsedAccountInfo(ata, commitment), conn.getAccountInfo(mdOf(mint), commitment)]);
  if (!mi.value) throw new Error('토큰 주소가 블록체인에 없습니다: ' + mintStr);
  const m = mi.value.data.parsed.info, a = ai.value ? ai.value.data.parsed.info : null, meta = mdi ? readMeta(mdi.data) : null;
  return { mint: mintStr, ata: ata.toBase58(), owner: mi.value.owner.toBase58(), supply: m.supply, decimals: m.decimals, mintAuthority: m.mintAuthority, freezeAuthority: m.freezeAuthority,
    holder: a && a.owner, held: a && a.tokenAmount.amount, heldMint: a && a.mint, meta };
}
const exactOk = (c) => c.owner === TOKEN.toBase58() && c.supply === RAW.toString() && c.decimals === CFG.decimals && c.holder === CFG.wallet && c.held === RAW.toString() && c.heldMint === c.mint
  && c.meta && c.meta.name === CFG.name && c.meta.symbol === CFG.symbol && c.meta.mint === c.mint && c.meta.updateAuthority === CFG.wallet && c.meta.isMutable;
let chain;
step(5, '⏳'); step(6, '⏳', '블록체인 최종 확정(finalized)까지 기다립니다(보통 30초 안)');
try {
  for (let i = 0; i < 60; i++) { try { chain = await readChain(existingMint, 'finalized'); break; } catch (e) { if (i === 59) throw e; await sleep(3000); } }
} catch (e) { stop(6, '블록체인 확인 실패: ' + (e.message || e) + ' — 다시 열면 이어서 확인합니다.', true); }
step(5, chain.holder === CFG.wallet && chain.held === RAW.toString() ? '✅' : '❌', `받은 지갑 ${esc(chain.holder)} · ${fmtInt(chain.held || 0)} (원 단위)`);
if (!exactOk(chain)) stop(6, '블록체인 값이 조건과 다릅니다. 권한 폐기를 하지 않습니다: ' + JSON.stringify(chain), false);
step(6, '✅', `총공급량 ${fmtInt(chain.supply)} (원 단위) = ${fmtInt(CFG.supplyWhole)} PUA · 소수점 ${chain.decimals} · 이름/심볼 ${esc(chain.meta.name)}/${esc(chain.meta.symbol)}`);

// ── 8·9. 권한 폐기(정확히 1조 개가 확인된 뒤에만) ───────────────────────────
let revokeSig = (loadRec() || {}).revokeSig || null;
if (chain.mintAuthority != null || chain.freezeAuthority != null) {
  if (chain.mintAuthority && chain.mintAuthority !== CFG.wallet || chain.freezeAuthority && chain.freezeAuthority !== CFG.wallet) stop(7, '권한자가 15번 지갑이 아닙니다: ' + chain.mintAuthority + ' / ' + chain.freezeAuthority, false);
  step(7, '👉', '아래 단추를 누르면 Phantom 승인 창이 뜹니다(되돌릴 수 없음)');
  $('box').innerHTML = `<div class="ok">1조 개 발행이 블록체인에서 확인되었습니다.</div><div class="card">민팅 권한(더 찍기)과 동결 권한(얼리기)을 영원히 없앱니다. 메타데이터 수정 권한은 그대로 둡니다.<button id="rv">권한 폐기하기</button></div>`;
  await new Promise((res) => { $('rv').onclick = res; });
  $('rv').disabled = true; $('rv').textContent = 'Phantom에서 승인해 주세요…';
  try {
    const mint = P(chain.mint), ixs = [];
    if (chain.mintAuthority) ixs.push(ixRevoke(mint, wallet, 0));
    if (chain.freezeAuthority) ixs.push(ixRevoke(mint, wallet, 1));
    const bh = await conn.getLatestBlockhash('confirmed');
    const tx = new W.VersionedTransaction(new W.TransactionMessage({ payerKey: wallet, recentBlockhash: bh.blockhash, instructions: [W.ComputeBudgetProgram.setComputeUnitLimit({ units: 30_000 }), W.ComputeBudgetProgram.setComputeUnitPrice({ microLamports: CFG.cuPrice }), ...ixs] }).compileToV0Message());
    const s = await sim(tx); if (s.err) { s.logs.slice(-6).forEach(log); stop(7, '미리 돌려 보니 실패합니다: ' + JSON.stringify(s.err), true); }
    revokeSig = await phantomSend(tx); saveRec({ ...loadRec(), revokeSig }); log('권한 폐기 거래 보냄: ' + revokeSig);
    step(7, '⏳', '블록체인 확인 중…');
    const r = await waitConfirm(revokeSig, bh.lastValidBlockHeight);
    if (r.err || r.dropped) stop(7, '권한 폐기 거래가 ' + (r.err ? '실패했습니다: ' + JSON.stringify(r.err) : '처리되지 않았습니다') + ' — 다시 열면 이어서 합니다.', true);
    step(7, '✅', `<a href="${solscan('tx', revokeSig)}" target="_blank">${revokeSig.slice(0, 24)}…</a>`);
  } catch (e) { if (e.message === 'STOP') throw e; stop(7, (e.message || String(e)) + ' — 다시 열면 이어서 합니다.', true); }
} else step(7, '✅', '이미 폐기됨');

step(8, '⏳');
for (let i = 0; i < 40; i++) { chain = await readChain(existingMint, 'finalized').catch(() => chain); if (chain.mintAuthority == null && chain.freezeAuthority == null) break; await sleep(3000); }
if (chain.mintAuthority != null || chain.freezeAuthority != null) stop(8, '권한 폐기가 아직 블록체인에 보이지 않습니다. 잠시 뒤 다시 열어 주세요.', true);
if (!exactOk(chain)) stop(8, '권한 폐기 뒤 값이 다릅니다: ' + JSON.stringify(chain), false);
step(8, '✅', '민팅 권한 없음 · 동결 권한 없음 · 공급량 그대로 ' + fmtInt(chain.supply));

// ── 10. 결과 보고서 ─────────────────────────────────────────────────────────
const rec = loadRec() || {};
const report = {
  결과: '성공', 시각: new Date().toISOString(), 네트워크: 'Solana Mainnet',
  토큰주소: chain.mint, 이름: chain.meta.name, 심볼: chain.meta.symbol, 소수점: chain.decimals,
  총공급량_원단위: chain.supply, 총공급량: fmtInt(CFG.supplyWhole) + ' PUA',
  받은지갑: chain.holder, 받은토큰계정: chain.ata, 받은수량_원단위: chain.held,
  민팅권한: '폐기됨(없음)', 동결권한: '폐기됨(없음)', 메타데이터: chain.meta.uri, 메타데이터수정권한: chain.meta.updateAuthority + ' (유지)',
  발행거래: rec.sig || '(이전 기록)', 권한폐기거래: revokeSig || '(이전 기록)',
  Solscan: solscan('token', chain.mint),
};
saveRec({ ...rec, report });
const text = JSON.stringify(report, null, 2);
step(9, '✅', '이 기기에 저장됨 · 아래에서 복사/내려받기');
$('box').innerHTML = `<div class="ok"><b>완료!</b> PUA 1조 개가 15번 지갑에 들어왔고, 민팅·동결 권한이 폐기되었습니다.</div>
  <div class="card"><table>
  <tr><td>토큰 주소</td><td><a href="${solscan('token', chain.mint)}" target="_blank">${chain.mint}</a></td></tr>
  <tr><td>발행 거래</td><td>${rec.sig ? `<a href="${solscan('tx', rec.sig)}" target="_blank">${rec.sig}</a>` : '-'}</td></tr>
  <tr><td>권한 폐기 거래</td><td>${revokeSig ? `<a href="${solscan('tx', revokeSig)}" target="_blank">${revokeSig}</a>` : '-'}</td></tr></table>
  <pre id="rep"></pre><button id="cp">보고서 복사</button><button id="dl" class="sec">보고서 내려받기</button></div>`;
$('rep').textContent = text;
$('cp').onclick = async () => { try { await navigator.clipboard.writeText(text); $('cp').textContent = '복사됨'; } catch { $('cp').textContent = '길게 눌러 직접 복사하세요'; } };
$('dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = 'PUA-발행결과.json'; a.click(); };
log('완료: ' + chain.mint);
</script>
</body>
</html>
