<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUA 분배</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d2430;--mute:#6b7380;--line:#e3dfd6;--ok:#1d7a46;--bad:#b42318;--acc:#6a3fd1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;gap:12px;align-items:center}.top img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#ddd}
h1{font-size:22px;margin:0}.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
ol{margin:0;padding:0;list-style:none}li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}li:last-child{border:0}
.i{width:22px;flex:none;text-align:center}.d{color:var(--mute);font-size:13px;word-break:break-all}
button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:17px;margin-top:10px}
button.sec{background:#ece6fb;color:var(--acc)}button:disabled{background:#c9c9cf}
.err{background:#fdecea;border:1px solid #f5c2bc;border-radius:10px;padding:10px;color:var(--bad);margin-top:10px;word-break:break-all}
.ok{background:#e6f4ea;border:1px solid #b7dfc3;border-radius:10px;padding:10px;color:var(--ok);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 2px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}td.n{text-align:right;white-space:nowrap}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#11151c;color:#cfe3ff;border-radius:10px;padding:10px;max-height:260px;overflow:auto}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<div class="top"><img id="logo" alt=""><div><h1>PUA 분배</h1><p class="sub">15번 지갑 → 6개 지갑 · 합계 1,000,000,000,000 PUA</p></div></div>
<div class="card"><table id="plan"></table></div>
<div class="card"><ol id="steps"></ol></div>
<div id="box"></div>
<div class="card"><b>기록</b><pre id="log"></pre></div>
</main>
<script type="module">
// PUA 분배 페이지 — Phantom 앱 안 브라우저에서 연다. 거래는 Phantom에서 사용자가 직접 승인한다.
// 복구 문구·개인키를 묻거나 저장하지 않는다. 받는 곳은 아래 표의 6개 지갑뿐이다(15번 지갑 주인 = 사용자).
const CFG = {
  mint: '7ZqsVXoVZe6WY1WTSmP566EhaLg3k39HNc4qHJEvJEQu', decimals: 6,
  from: '77BKPhaQkqDfJ9JkxJKdiCAchsoGRpvkkyeXAovbMjQg',                       // 15번 발행·관리
  rpc: 'https://solana-rpc.publicnode.com', memo: 'PUA-SPLIT-v1', cuPrice: 100_000,
  image: 'https://raw.githubusercontent.com/ljy1217/pua-coin/main/pua.png',
  to: [ // [번호, 이름, 주소, 개수(소수점 아래 없음)]
    [11, '개발자', 'An39SmRXweHasnLWq1nj3v4L7Z4Q8WaAnfPTqrds7DGh', 150_000_000_000n],
    [12, '유동성 LP', '4axVZG68ocBPAbLcUcpdvQBkLH3u9TxCYReTZJRiu7qt', 100_000_000_000n],
    [13, '거래소 예비', '9QTUmh84Lms77yEHtBouhJNBmBzUp47keMJWgqQPi3yu', 100_000_000_000n],
    [14, '마케팅', '9ymo5rmAMMDAnH4vh4pM6SSZ2kpaEi3SSdfzK7FaWLdY', 150_000_000_000n],
    [16, '6개월 락업', 'ABcPVLQpdgEV78SCgjaGqhy45bPeXNafGpFQjsVSqMMD', 250_000_000_000n],
    [17, '10개월 락업', '3LNaBN9wB8UKJkhqkiC6qXjyPxRNjvccUHj6HSoXkgDW', 250_000_000_000n],
  ],
};
const UNIT = 10n ** BigInt(CFG.decimals), TOTAL = 1_000_000_000_000n * UNIT;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtInt = (b) => BigInt(b).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const fmtSol = (l) => (Number(l) / 1e9).toFixed(6) + ' SOL';
const log = (m) => { $('log').textContent += new Date().toLocaleTimeString() + '  ' + m + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const solscan = (t, id) => `https://solscan.io/${t}/${id}`;
$('logo').src = CFG.image;
const rows = (extra) => CFG.to.map(([n, name, addr, amt], i) => `<tr><td>${n} ${esc(name)}<br><span class="d">${addr.slice(0, 6)}…${addr.slice(-4)}</span></td><td class="n">${fmtInt(amt)}${extra ? '<br>' + extra(i) : ''}</td></tr>`).join('')
  + `<tr><td><b>합계</b></td><td class="n"><b>${fmtInt(CFG.to.reduce((a, x) => a + x[3], 0n))}</b></td></tr>`;
$('plan').innerHTML = rows();
const STEPS = ['Phantom 15번 지갑 연결', '이미 분배했는지 확인', '받는 지갑·수량·수수료 검사', '6곳에 보내기 (Phantom 승인 1번)', '블록체인에서 6곳 개수 확인', '결과 보고서'];
const st = STEPS.map(() => ['·', '']);
function step(i, icon, detail) { st[i] = [icon, detail || '']; $('steps').innerHTML = STEPS.map((t, j) => `<li><span class="i">${st[j][0]}</span><span>${j + 1}. ${t}${st[j][1] ? '<br><span class="d">' + st[j][1] + '</span>' : ''}</span></li>`).join(''); }
step(0, '·');
function stop(i, why, retry) {
  step(i, '❌', esc(why)); log('멈춤: ' + why);
  $('box').innerHTML = `<div class="err"><b>${i + 1}단계에서 멈췄습니다.</b><br>${esc(why)}</div>` + (retry ? '<button id="retry" class="sec">처음부터 다시 확인</button>' : '');
  if (retry) $('retry').onclick = () => location.reload();
  throw new Error('STOP');
}
if (CFG.to.reduce((a, x) => a + x[3], 0n) * UNIT !== TOTAL) stop(0, '분배표 합계가 1조가 아닙니다', false);

let W, Buffer;
try { ({ Buffer } = await import('https://esm.sh/buffer@6.0.3')); W = await import('https://esm.sh/@solana/web3.js@1.98.0'); }
catch (e) { stop(0, 'Solana 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.', true); }
const P = (s) => new W.PublicKey(s);
const TOKEN = P('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'), ATA = P('ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL'), MEMO = P('MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr');
const SYS = W.SystemProgram.programId, enc = new TextEncoder();
const u64 = (v) => { const b = new Uint8Array(8); let x = BigInt(v); if (x < 0n || x > 0xffffffffffffffffn) throw new Error('u64'); for (let i = 0; i < 8; i++) { b[i] = Number(x & 0xffn); x >>= 8n; } return b; };
const k = (pubkey, s, w) => ({ pubkey, isSigner: s, isWritable: w });
const ix = (programId, keys, data) => new W.TransactionInstruction({ programId, keys, data: Buffer.from(data) });
const ataOf = (o, m) => W.PublicKey.findProgramAddressSync([o.toBuffer(), TOKEN.toBuffer(), m.toBuffer()], ATA)[0];
const mint = P(CFG.mint), from = P(CFG.from), src = ataOf(from, mint);
const dests = CFG.to.map(([n, name, addr, amt]) => ({ n, name, owner: P(addr), ata: ataOf(P(addr), mint), raw: amt * UNIT }));
// 받는 지갑의 PUA 칸 만들기(Idempotent) — 보증금은 15번이 낸다, 주인은 받는 지갑
const ixAta = (d) => ix(ATA, [k(from, true, true), k(d.ata, false, true), k(d.owner, false, false), k(mint, false, false), k(SYS, false, false), k(TOKEN, false, false)], Uint8Array.of(1));
// TransferChecked(12): 토큰 주소·소수점을 함께 검사하며 보낸다
const ixSend = (d) => ix(TOKEN, [k(src, false, true), k(mint, false, false), k(d.ata, false, true), k(from, true, false)], Uint8Array.from([12, ...u64(d.raw), CFG.decimals]));
const ixMemo = () => ix(MEMO, [k(from, true, false)], enc.encode(CFG.memo));
const conn = new W.Connection(CFG.rpc, 'confirmed');
const recKey = 'pua_split_' + CFG.mint;
const loadRec = () => { try { return JSON.parse(localStorage.getItem(recKey) || 'null'); } catch { return null; } };
const saveRec = (r) => { try { localStorage.setItem(recKey, JSON.stringify(r)); } catch {} };
const amt = async (ata, c = 'confirmed') => { const r = await conn.getParsedAccountInfo(ata, c); return r.value ? BigInt(r.value.data.parsed.info.tokenAmount.amount) : null; };

// 1. 연결
const provider = window.phantom && window.phantom.solana && window.phantom.solana.isPhantom ? window.phantom.solana : null;
if (!provider) {
  $('box').innerHTML = '<button id="openPh">Phantom 앱에서 열기</button>';
  $('openPh').onclick = () => { location.href = 'https://phantom.app/ul/browse/' + encodeURIComponent(location.href) + '?ref=' + encodeURIComponent(location.origin); };
  stop(0, '이 페이지는 Phantom 앱 안의 브라우저에서 열어야 합니다.', false);
}
step(0, '⏳', 'Phantom 연결 창에서 [연결]을 눌러 주세요');
let me; try { me = (await provider.connect()).publicKey.toString(); } catch { stop(0, 'Phantom 연결을 취소했습니다.', true); }
if (me !== CFG.from) stop(0, '지금 고른 지갑은 ' + me + ' 입니다. Phantom에서 15번(발행·관리) 지갑으로 바꾼 뒤 다시 여세요.', true);
provider.on && provider.on('accountChanged', () => location.reload());
step(0, '✅', CFG.from);

// 2. 중복 확인 (조회 실패 시 멈춤)
step(1, '⏳');
let done = false;
try {
  const sigs = await conn.getSignaturesForAddress(from, { limit: 1000 });
  const hits = sigs.filter((s) => (s.memo || '').includes(CFG.memo) && !s.err);
  if (hits.some((s) => s.confirmationStatus === 'processed')) stop(1, '아직 확정되지 않은 분배 거래가 있습니다. 1분 뒤 다시 열어 주세요.', true);
  if (hits.length) { done = true; saveRec({ ...(loadRec() || {}), sig: hits[hits.length - 1].signature, status: 'done' }); }
  const rec = loadRec();
  if (!done && rec && rec.sig && rec.status === 'pending') {
    const s = (await conn.getSignatureStatuses([rec.sig], { searchTransactionHistory: true })).value[0];
    if (s && !s.err) done = true;
    else if (!s && (await conn.getBlockHeight('confirmed')) <= rec.lastValidBlockHeight) stop(1, '방금 보낸 분배 거래의 결과를 아직 모릅니다. 1~2분 뒤 다시 열어 주세요(같은 거래를 또 보내지 않습니다).', true);
    else saveRec({ ...rec, status: 'failed' });
  }
} catch (e) { if (e.message === 'STOP') throw e; stop(1, '블록체인 조회에 실패해 중복 여부를 확인할 수 없습니다. 보내지 않습니다. (' + (e.message || e) + ')', true); }
step(1, '✅', done ? '이미 분배됨 → 확인 단계로' : '이전 분배 없음');

async function waitConfirm(sig, lastValid) {
  for (;;) {
    const s = (await conn.getSignatureStatuses([sig], { searchTransactionHistory: true }).catch(() => ({ value: [null] }))).value[0];
    if (s && s.err) return { err: s.err };
    if (s && (s.confirmationStatus === 'confirmed' || s.confirmationStatus === 'finalized')) return { ok: true };
    if (!s && (await conn.getBlockHeight('confirmed').catch(() => 0)) > lastValid) { await sleep(3000); const l = (await conn.getSignatureStatuses([sig], { searchTransactionHistory: true })).value[0]; if (!l) return { dropped: true }; }
    await sleep(2000);
  }
}
async function phantomSend(tx) {
  try { return (await provider.signAndSendTransaction(tx)).signature; }
  catch (e) {
    if (e && (e.code === 4001 || /reject|cancel|declin/i.test(String(e.message)))) throw new Error('Phantom에서 승인을 취소했습니다. 아무것도 보내지 않았습니다.');
    log('Phantom 서명·전송 실패(' + (e.message || e) + ') → 서명만 받아 직접 보냅니다');
    const before = Buffer.from(tx.message.serialize()).toString('hex');
    const signed = await provider.signTransaction(tx);
    if (Buffer.from(signed.message.serialize()).toString('hex') !== before) throw new Error('Phantom이 거래 내용을 바꿔서 보내지 않았습니다.');
    return await conn.sendRawTransaction(signed.serialize(), { maxRetries: 5, preflightCommitment: 'confirmed' });
  }
}
async function build() {
  const bh = await conn.getLatestBlockhash('confirmed');
  const ixs = [W.ComputeBudgetProgram.setComputeUnitLimit({ units: 300_000 }), W.ComputeBudgetProgram.setComputeUnitPrice({ microLamports: CFG.cuPrice })];
  for (const d of dests) ixs.push(ixAta(d), ixSend(d));
  ixs.push(ixMemo());
  return { bh, tx: new W.VersionedTransaction(new W.TransactionMessage({ payerKey: from, recentBlockhash: bh.blockhash, instructions: ixs }).compileToV0Message()) };
}

if (!done) {
  // 3. 검사
  step(2, '⏳');
  let cost;
  try {
    if ((await amt(src)) !== TOTAL) stop(2, '15번 지갑의 PUA가 정확히 1조 개가 아닙니다(일부를 이미 보냈을 수 있음). 보내지 않습니다: ' + fmtInt(await amt(src) || 0n), false);
    const infos = await conn.getMultipleAccountsInfo(dests.map((d) => d.owner), 'confirmed');
    dests.forEach((d, i) => {
      if (!W.PublicKey.isOnCurve(d.owner.toBytes())) stop(2, d.n + '번 주소가 일반 지갑 주소가 아닙니다: ' + d.owner.toBase58(), false);
      if (infos[i] && !infos[i].owner.equals(SYS)) stop(2, d.n + '번 주소가 일반 지갑이 아닙니다(프로그램 계정): ' + d.owner.toBase58(), false);
    });
    const ex = await Promise.all(dests.map((d) => amt(d.ata)));
    ex.forEach((v, i) => { if (v && v > 0n) stop(2, dests[i].n + '번 지갑에 이미 PUA가 ' + fmtInt(v) + ' 있습니다. 보내지 않습니다.', false); });
    const { tx } = await build();
    const bal = await conn.getBalance(from, 'confirmed');
    const v = (await conn.simulateTransaction(tx, { sigVerify: false, replaceRecentBlockhash: true, commitment: 'confirmed', accounts: { encoding: 'base64', addresses: [CFG.from] } })).value;
    if (v.err) { (v.logs || []).slice(-8).forEach(log); stop(2, '미리 돌려 보니 실패합니다: ' + JSON.stringify(v.err), true); }
    const fee = (await conn.getFeeForMessage(tx.message, 'confirmed')).value || 0;
    cost = bal - Number(v.accounts[0].lamports) + fee;
    if (bal < cost + 2_000_000) stop(2, 'SOL이 모자랍니다. 잔액 ' + fmtSol(bal) + ', 필요 약 ' + fmtSol(cost + 2_000_000), true);
    step(2, '✅', `주소 6개 정상 · 합계 1조 · 예상 비용 약 ${fmtSol(cost)} (잔액 ${fmtSol(bal)})`);
  } catch (e) { if (e.message === 'STOP') throw e; stop(2, '검사 중 오류: ' + (e.message || e), true); }

  // 4. 보내기
  step(3, '👉', '단추를 누른 뒤 1분 안에 Phantom에서 승인해 주세요');
  $('box').innerHTML = `<div class="card">위 표대로 6곳에 보냅니다. 예상 비용 약 ${fmtSol(cost)}.<button id="go">6곳에 PUA 보내기</button></div>`;
  await new Promise((r) => { $('go').onclick = r; });
  $('go').disabled = true; $('go').textContent = 'Phantom에서 승인해 주세요…';
  try {
    const { tx, bh } = await build();
    saveRec({ status: 'sending', lastValidBlockHeight: bh.lastValidBlockHeight, at: Date.now() });
    const sig = await phantomSend(tx);
    saveRec({ ...loadRec(), sig, status: 'pending' }); log('분배 거래 보냄: ' + sig);
    step(3, '⏳', '블록체인 확인 중…');
    const r = await waitConfirm(sig, bh.lastValidBlockHeight);
    if (r.err) { saveRec({ ...loadRec(), status: 'failed' }); stop(3, '분배 거래가 실패했습니다(아무것도 안 보내짐): ' + JSON.stringify(r.err), true); }
    if (r.dropped) { saveRec({ ...loadRec(), status: 'failed' }); stop(3, '승인이 늦어 거래가 버려졌습니다(아무것도 안 보내짐, 수수료도 안 나감). 다시 열어 처음부터, 이번엔 빠르게 승인해 주세요.', true); }
    saveRec({ ...loadRec(), status: 'done' });
    step(3, '✅', `<a href="${solscan('tx', sig)}" target="_blank">${sig.slice(0, 24)}…</a>`);
  } catch (e) {
    if (e.message === 'STOP') throw e;
    const rec = loadRec(); if (rec && rec.status === 'sending') saveRec({ ...rec, status: 'failed' });
    stop(3, (e.message || String(e)) + ' — 다시 열면 기존 거래 상태부터 확인합니다.', true);
  }
} else { step(2, '✅', '이미 분배됨 — 건너뜀'); step(3, '✅', '이미 분배됨'); }

// 5. 확인
step(4, '⏳', '블록체인 최종 확정까지 기다립니다');
let got, left;
for (let i = 0; i < 40; i++) {
  try { got = await Promise.all(dests.map((d) => amt(d.ata, 'finalized'))); left = await amt(src, 'finalized'); if (got.every((v, j) => v === dests[j].raw)) break; } catch {}
  await sleep(3000);
}
$('plan').innerHTML = rows((i) => got && got[i] === dests[i].raw ? '<span style="color:var(--ok)">✅ 들어옴</span>' : '<span style="color:var(--bad)">❌ ' + (got && got[i] != null ? fmtInt(got[i] / UNIT) : '없음') + '</span>');
if (!got || !got.every((v, j) => v === dests[j].raw)) stop(4, '아직 6곳 모두 확인되지 않았습니다. 잠시 뒤 다시 열어 주세요.', true);
step(4, '✅', `6곳 모두 정확 · 15번 남은 PUA ${fmtInt((left || 0n) / UNIT)}`);

// 6. 보고서
const rec = loadRec() || {};
const report = { 결과: '분배 성공', 시각: new Date().toISOString(), 토큰: CFG.mint, 보낸지갑: CFG.from, 거래: rec.sig || '(이전 기록)',
  받은지갑: dests.map((d, i) => ({ 번호: d.n, 이름: d.name, 주소: d.owner.toBase58(), 개수: fmtInt(got[i] / UNIT) })), 보낸지갑_남은개수: fmtInt((left || 0n) / UNIT) };
const text = JSON.stringify(report, null, 2);
step(5, '✅');
$('box').innerHTML = `<div class="ok"><b>완료!</b> 6곳 모두 정확히 들어왔습니다.</div><div class="card"><pre id="rep"></pre><button id="cp">보고서 복사</button></div>`;
$('rep').textContent = text;
$('cp').onclick = async () => { try { await navigator.clipboard.writeText(text); $('cp').textContent = '복사됨'; } catch { $('cp').textContent = '길게 눌러 직접 복사하세요'; } };
log('완료');
</script>
</body>
</html>
